<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圖面編輯工具</title>
<script src="./vendor/pdfjs/pdf.min.js"></script>
<script src="./vendor/jszip/jszip.min.js"></script>
<script src="./vendor/pdf-lib/pdf-lib.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa; --panel: #fff; --panel-edge: #d9e1ea; --grid: #f5f7fa;
    --line: #d9e1ea; --accent: #245c89; --accent-dim: #245c89;
    --ink: #243447; --ink-dim: #68788b; --ok: #23834b; --warn: #ad6800;
    --mono: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px, var(--bg);
    color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--panel-edge);
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  header .title-block { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: 0.02em; }
  header .sub { font-family: var(--sans); font-size: 12px; color: var(--ink-dim); }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 270px; min-width: 150px; flex-shrink: 0; border-right: 1px solid var(--panel-edge); background: var(--panel); display: flex; flex-direction: column; }
  .sidebar-resizer { width: 6px; flex-shrink: 0; cursor: col-resize; background: var(--panel-edge); touch-action: none; }
  .sidebar-resizer:hover { background: var(--accent); }
  .upload-zone {
    margin: 14px; border: 1.5px dashed var(--line); border-radius: 4px; padding: 18px 10px;
    text-align: center; font-size: 13px; color: var(--ink-dim); cursor: pointer; transition: border-color .15s, color .15s;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); color: var(--accent); }
  .upload-zone input { display: none; }
  .file-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .file-item {
    display: flex; flex-direction: column; gap: 3px; padding: 8px 8px; border-radius: 3px;
    cursor: pointer; border-left: 2px solid transparent;
  }
  .file-item:hover { background: rgba(94,168,255,.06); }
  .file-item.active { background: rgba(94,168,255,.12); border-left-color: var(--accent); }
  .file-item .row { display: flex; align-items: center; gap: 8px; width: 100%; }
  .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--ink); }
  .page-nav { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 4px 12px; }
  .page-nav button { width: 28px; height: 28px; padding: 0; flex-shrink: 0; }
  .page-nav span { font-size: 12px; text-align: center; white-space: nowrap; }
  body.busy main, body.busy .header-actions { pointer-events: none; opacity: .65; }
  .preview-sheet { margin: 0 auto 24px; flex-shrink: 0; }
  .preview-sheet figcaption { margin-bottom: 8px; color: var(--ink-dim); text-align: center; font-size: 12px; }
  .preview-paper { background: white; position: relative; }
  .preview-paper canvas { width: 100%; height: 100%; cursor: default; }
  #modalBody { display: block; }
  .badge { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
  .badge.done { background: var(--ok); }
  .status-text { font-size: 10.5px; margin-left: 16px; font-family: var(--sans); }
  .status-text.pending { color: var(--warn); }
  .status-text.done { color: var(--ok); }
  .file-count { padding: 10px 18px; font-family: var(--sans); font-size: 11px; color: var(--ink-dim); border-top: 1px solid var(--panel-edge); }
  .stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  #workArea { flex: 1; min-height: 0; width: 100%; flex-direction: column; }
  .toolbar {
    flex-shrink: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    padding: 14px 20px; background: var(--bg); border-bottom: 1px solid var(--panel-edge); z-index: 10;
  }
  .canvas-scroll { flex: 1; min-height: 0; overflow: auto; padding: 20px; }
  button {
    font-family: var(--sans); font-size: 13px; padding: 8px 16px; border-radius: 3px;
    border: 1px solid var(--panel-edge); background: transparent; color: var(--ink); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
  .header-actions button { background: #801f2b; border-color: #801f2b; color: #fff; }
  .header-actions button:hover:not(:disabled) { background: #a32b3a; border-color: #a32b3a; }
  .note-menu-wrap { position: relative; }
  .note-menu { position: absolute; top: calc(100% + 5px); left: 0; min-width: 130px; padding: 5px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 16px #0008; }
  .note-menu button { display: block; width: 100%; text-align: left; color: #111; margin: 3px 0; }
  body.grabbing, body.grabbing * { cursor: grabbing !important; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .canvas-wrap {
    position: relative; border: 1px solid var(--panel-edge);
    background: repeating-conic-gradient(#0e1626 0% 25%, #0a1120 0% 50%) 50%/20px 20px;
    width: max-content; margin: 0 auto;
  }
  canvas { display: block; cursor: crosshair; }
  .sticky-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .sticky-note {
    position: absolute; background: #ffeb3b; border-style: solid; border-color: #111;
    color: #111; pointer-events: auto; z-index: 2; cursor: grab; touch-action: none;
  }
  .sticky-note.selected, .sticky-note.ai-review.selected { outline: 3px solid #1677ff; outline-offset: 2px; }
  .sticky-note.ai-note { background:transparent; color:#e03024; border-color:transparent; border-radius:0; }
  .ai-note .sticky-text { color:transparent !important; caret-color:#e03024; z-index:1; }
  .ai-colored-text { position:absolute; display:block; margin:0; padding:0; overflow:hidden; pointer-events:none;
    font-family:var(--sans); line-height:1.35; white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal; }
  .ai-note .sticky-resize { background:#fff; }
  .ai-note.ai-review { outline:2px dashed #e69b00; outline-offset:2px; }
  .ai-note .ai-note-delete { display:none; }
  .ai-note.selected .ai-note-delete { display:flex; }
  .ai-glossary { position:absolute; z-index:30; background:#fff; border:1px solid var(--line); padding:12px; box-shadow:0 6px 20px #0003; width:280px; }
  .ai-glossary[hidden] { display:none; }
  .ai-glossary textarea { width:100%; height:110px; resize:vertical; font:12px/1.5 monospace; }
  .ai-glossary label { display:block; font-size:12px; margin-bottom:6px; }
  .sticky-text {
    position: absolute; display: block; margin: 0; padding: 0; border: 0; outline: 0;
    resize: none; overflow: hidden; background: transparent; color: #111; cursor: text;
    font-family: var(--sans); line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .sticky-drag-handle {
    position: absolute; top: 0; left: 6px; right: 12px; height: 6px; cursor: grab;
    user-select: none; touch-action: none; pointer-events: auto;
  }
  .sticky-resize {
    position: absolute; width: 10px; height: 10px; border: 1px solid #111;
    background: #fff; z-index: 4; touch-action: none;
  }
  .sticky-resize.nw { left: -6px; top: -6px; cursor: nwse-resize; }
  .sticky-resize.ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .sticky-resize.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
  .sticky-resize.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  header .title-block { flex: 1; min-width: 280px; flex-wrap: nowrap; }
  header h1 { flex-shrink: 0; }
  header .sub { line-height: 1.8; }
  .header-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .file-list { padding-right: 0; }
  .file-item { padding-right: 0; }
  .finished-label { flex-shrink: 0; background: #7137a8; color: #ffeb3b; padding: 4px 6px; font-size: 11px; }
  .mask-layer { position: absolute; inset: 0; pointer-events: none; }
  .mask-box { position: absolute; pointer-events: auto; outline: 1px dashed #5ea8ff; cursor: grab; touch-action: none; }
  .mask-delete,.sticky-delete,.ai-note-delete { position:absolute; top:-10px; right:-10px; z-index:5; width:20px; height:20px;
    padding:0; border:1px solid #111; border-radius:50%; background:#fff; color:#111;
    font:700 14px/18px var(--sans); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .mask-delete:hover,.sticky-delete:hover:not(:disabled),.ai-note-delete:hover:not(:disabled) { background:#111; color:#fff; border-color:#111; }
  .mask-box .sticky-resize { pointer-events: auto; }
  #progressMessage { font-size: 12px; color: #ff4d4d; width: 100%; }
  .empty { margin: auto; text-align: center; color: var(--ink-dim); font-size: 13px; }
  .page-zoom-tools { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
  .zoom-button { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border-radius: 3px; background: var(--panel); font-size: 18px; flex-shrink: 0; }
  .modal {
    position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column;
    background: rgba(5, 9, 16, .97);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .modal.open { display: flex; }
  .modal-bar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--panel-edge); background: var(--panel);
  }
  .modal-title { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .modal-tools .zoom-label { font-family: var(--sans); font-size: 12px; color: var(--ink-dim); min-width: 48px; text-align: center; }
  .modal-tools button { padding: 6px 12px; }
  .modal-close { width: 34px; height: 34px; padding: 0 !important; display: flex; align-items: center; justify-content: center; border-radius: 3px; }
  .modal-body { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 20px; }
  .modal-body img { margin: auto; flex-shrink: 0; display: block; box-shadow: 0 0 0 1px var(--panel-edge); background: #fff; }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    .sidebar-resizer { display: none; }
    aside { width: 100% !important; max-height: 180px; border-right: none; border-bottom: 1px solid var(--panel-edge); }
  }

  body { background:var(--bg); }
  header { background:#fff; padding:16px 20px; align-items:flex-start; }
  header .title-block { flex-direction:column; align-items:flex-start; gap:4px; flex-wrap:wrap; }
  header h1 { font-size:20px; }
  header .sub { font-size:12px; color:var(--ink-dim); }
  aside { background:#fff; }
  .sidebar-resizer { background:var(--panel-edge); }
  .upload-zone { border-radius:6px; background:var(--bg); color:var(--ink); }
  .file-item { border-radius:6px; }
  .file-item:hover { background:var(--bg); }
  .file-item.active { background:color-mix(in srgb,var(--accent) 10%,white); border-left-color:var(--accent); }
  .toolbar { background:#fff; padding:12px; justify-content:flex-start; }
  button { border-radius:6px; background:#fff; color:var(--ink); padding:7px 12px; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button.primary:hover:not(:disabled) { background:var(--accent); filter:brightness(1.12); }
  .header-actions button { background:#fff; border-color:var(--line); color:var(--ink); }
  .header-actions #clearProgressBtn { color:#c93636; border-color:#ffd8d8; }
  .header-actions #saveProgressBtn,.header-actions #exportBtn { background:var(--accent);border-color:var(--accent);color:#fff; }
  .header-actions button:hover:not(:disabled) { background:var(--bg); border-color:var(--accent); }
  .header-actions #saveProgressBtn:hover:not(:disabled),.header-actions #exportBtn:hover:not(:disabled) { background:var(--accent); filter:brightness(1.12); }
  .note-menu { z-index:20; background:#fff; box-shadow:0 6px 22px #0002; border-color:var(--line); border-radius:6px; }
  .note-menu[hidden] { display:none; }
  .zoom-button { background:#fff; font-size:18px; }
  .canvas-wrap { background:repeating-conic-gradient(#f1f3f6 0% 25%,#fff 0% 50%) 50%/20px 20px; }
  .modal { background:rgba(20,31,44,.92); }
  .modal-bar { background:#fff; }
  .modal-body { background:var(--bg); display:block; text-align:center; }
  .preview-sheet { width:max-content; }
  .preview-paper { margin:auto; }
  .modal-body img { margin:auto; }
  .finished-label { background:#f0e8fc; color:#7137a8; border-radius:4px; }
  #progressMessage { color:#c93636; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  header { padding:0; border:0; display:block; background:transparent; }
  .header-actions[hidden],.toolbar[hidden],#progressMessage:empty { display:none; }
  #progressMessage:not(:empty) { padding:8px 16px; background:#fff; border-bottom:1px solid var(--panel-edge); }
  #stopAiBtn { margin:6px 16px; padding:5px 12px; border:1px solid var(--panel-edge); background:#fff; color:#172d45; cursor:pointer; }
  #stopAiBtn[hidden],#aiFailures[hidden] { display:none; }
  #aiFailures { padding:6px 16px; background:#fff; border-bottom:1px solid var(--panel-edge); font-size:12px; }
  #aiFailures summary { cursor:pointer; }
  #aiFailures ol { max-height:160px; overflow:auto; margin:6px 0; padding-left:24px; }
  #aiTranslations[hidden] { display:none; }
  #aiTranslations { padding:6px 16px; background:#fff; border-bottom:1px solid var(--panel-edge); font-size:12px; flex-shrink:0; }
  #aiTranslations summary { cursor:pointer; }
  #aiTranslationsList { max-height:min(28vh,240px); overflow:auto; margin:6px 0 0; border:1px solid var(--panel-edge); border-radius:4px; }
  .ai-translation-row { display:flex; align-items:center; gap:12px; padding:7px 9px; border-bottom:1px solid var(--panel-edge); cursor:pointer; min-width:0; }
  .ai-translation-row:last-child { border-bottom:0; }
  .ai-translation-row:hover,.ai-translation-row:focus-visible,.ai-translation-row.selected { background:#e8f2ff; }
  .ai-page { flex:none; min-width:48px; }
  .ai-source,.ai-translation { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ai-translation-actions { display:flex; gap:5px; flex:none; margin-left:auto; }
  .ai-translation-actions button { color:#fff; border:0; padding:5px 9px; white-space:nowrap; }
  .ai-retain { background:#23834b; }.ai-delete { background:#c93636; }
  .ai-translation-actions button:hover:not(:disabled) { filter:brightness(.85); }
  .toolbar { width:100%; justify-content:flex-start; flex-shrink:0; border-top:1px solid var(--panel-edge); }
  body.busy .toolbar { pointer-events:none; opacity:.65; }
  main { min-height:0; }
  .toolbar { min-height:66px; }
  .toolbar[hidden] { display:flex; visibility:hidden; pointer-events:none; }
  header { display:none; }
  .stage { min-height:0; }
  #emptyState { margin:20px auto; }
  @media(max-width:720px) { header .title-block { min-width:0; } .toolbar { gap:7px; } .canvas-scroll { padding:12px; } }
</style>
<script>
window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.data?.type !== 'drawing-editor-theme') return;
  const color = event.data.color;
  if (/^#[0-9a-fA-F]{6}$/.test(color)) document.documentElement.style.setProperty('--accent',color);
});
</script>
</head>
<body>
<header>
  <div class="header-actions" hidden>
    <button id="undoBtn" disabled>復原</button>
    <button id="redoBtn" disabled>重做</button>
    <button id="clearProgressBtn">清除進度且重新作業</button>
    <button class="primary" id="previewBtn" disabled>預覽本檔完工圖</button>
    <button class="primary" id="saveProgressBtn" disabled>暫存目前進度</button>
    <button class="primary" id="exportBtn" disabled>匯出所有完工圖</button>
  </div>
</header>
<div id="progressMessage" role="status" aria-live="polite"></div>
<button id="stopAiBtn" type="button" hidden>完成目前翻譯批次並檢查草稿</button>
<details id="aiFailures" hidden><summary>模型拒絕項目（待人工處理）</summary><ol id="aiFailuresList"></ol></details>
<details id="aiTranslations" hidden><summary>本檔 AI 翻譯</summary><div id="aiTranslationsList"></div></details>
<main>
  <aside>
    <label class="upload-zone" id="uploadZone">
      上傳圖面PDF檔（可多選）
      <input type="file" id="fileInput" accept="application/pdf" multiple>
    </label>
    <div class="file-list" id="fileList"></div>
    <div class="file-count" id="fileCount">尚未上傳檔案</div>
  </aside>
  <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-label="調整左欄寬度" aria-orientation="vertical" tabindex="0"></div>
  <div class="stage">
    <div class="empty" id="emptyState">請先上傳一或多個 PDF 檔案</div>
    <div id="workArea" style="display:none;">
      <div class="toolbar">
        <div class="note-menu-wrap">
          <button class="primary" id="addNoteBtn" aria-expanded="false" aria-controls="noteMenu">新增便利貼</button>
          <div class="note-menu" id="noteMenu" hidden>
            <button type="button" data-color="#ffeb3b" style="background:#ffeb3b">黃色</button>
            <button type="button" data-color="#ffb6d5" style="background:#ffb6d5">粉紅色</button>
            <button type="button" data-color="#a9dcff" style="background:#a9dcff">淺藍色</button>
          </div>
        </div>
        <button class="primary" id="batchStickyFileBtn" disabled>批次處理便利貼（套用檔內）</button>
        <button class="primary" id="batchStickyOtherBtn" disabled>批次處理便利貼（套用餘檔首頁）</button>
        <button class="primary" id="fontGrowBtn" disabled>字放大</button>
        <button class="primary" id="fontShrinkBtn" disabled>字縮小</button>
        <button class="primary" id="resetBtn">全部重新框選</button>
        <button class="primary" id="applyBtn" disabled>遮蓋</button>
        <button class="primary" id="batchBtn" disabled title="將本頁遮蓋區域按比例套用至此 PDF 所有頁面">批次遮蓋（套用檔內）</button>
        <button class="primary" id="batchOtherBtn" disabled title="將紅框按比例套用到其他 PDF 首頁；同尺寸直接遮蔽，不同尺寸僅放紅框">批次遮蓋（套用餘檔首頁）</button>
        <button class="primary" id="aiTranslateBtn" disabled>翻譯本檔全部頁面</button>
        <button class="primary" id="addTranslationBtn" disabled>新增翻譯貼紙</button>
        <button class="primary" id="aiRetainPageBtn" disabled>保留本頁所有翻譯</button>
        <button class="primary" id="aiDeletePageBtn" disabled>刪除本頁所有翻譯</button>
        <div class="note-menu-wrap">
          <button class="primary" id="translationColorBtn" disabled aria-expanded="false" aria-controls="translationColorMenu">變更譯文顏色</button>
          <div class="note-menu" id="translationColorMenu" hidden>
            <button type="button" data-color="#e03024" style="color:#e03024">紅色</button>
            <button type="button" data-color="#168a38" style="color:#168a38">綠色</button>
            <button type="button" data-color="#111111" style="color:#111111">黑色</button>
          </div>
        </div>
        <button class="primary" id="markBtn">標記完稿/取消標記</button>
        <div class="page-zoom-tools">
          <button class="zoom-button" id="zoomInBtn" title="放大圖片" aria-label="放大圖片">＋</button>
          <button class="zoom-button" id="zoomOutBtn" title="縮小圖片" aria-label="縮小圖片">－</button>
        </div>
      </div>
      <div class="canvas-scroll">
        <div class="canvas-wrap">
          <canvas id="pageCanvas"></canvas>
          <div class="mask-layer" id="maskLayer"></div>
          <div class="sticky-layer" id="stickyLayer"></div>
        </div>
      </div>
    </div>
  </div>
</main>
<div class="modal" id="previewModal" role="dialog" aria-modal="true" aria-label="預覽本檔完工圖">
  <div class="modal-bar">
    <span class="modal-title" id="modalTitle"></span>
    <div class="modal-tools">
      <button id="mZoomOut" title="縮小">－</button>
      <span class="zoom-label" id="mZoomLabel">100%</span>
      <button id="mZoomIn" title="放大">＋</button>
      <button class="modal-close" id="modalClose" title="關閉視窗" aria-label="關閉視窗">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
  </div>
  <div class="modal-body" id="modalBody"></div>
</div>

<script type="module">
import { exportIndependentPDF } from './independent-pdf-engine.js';

// Existing editor operations target the selected page through these accessors.
function attachPageAccessors(file) {
  for (const key of [...pageEditKeys, ...pageRuntimeKeys]) {
    Object.defineProperty(file, key, { configurable: true,
      get() { return file.pages[file.pageIndex][key]; },
      set(value) { file.pages[file.pageIndex][key] = value; }
    });
  }
  file.pdfPromise = null;
  return file;
}
function pageEdits(page) {
  return Object.fromEntries(pageEditKeys.map(key => [key, page[key]]));

async function travelHistory(forward) {
  const file = state.files[state.currentIndex];
  const from = file && (forward ? file.future : file.history);
  if (busy || !from || !from.length) return;
  const group = from.at(-1).crossBatchGroup;
  if (group) {
    const key = forward ? 'future' : 'history';
    if (!group.members.every(index => state.files[index]?.[key].at(-1)?.crossBatchGroup?.id === group.id)) {
      progressMessage.textContent = '這筆跨檔批次操作之後，其他檔案還有編輯；請先復原／重做那些編輯，再一起復原／重做批次。';
      return;
    }
    const pageIndex = from.at(-1).pageIndex;
    group.members.forEach(index => {
      const target = state.files[index];
      const opposite = forward ? target.history : target.future;
      const previous = target[key].pop();
      opposite.push({ ...snapshot(target), crossBatchGroup: group });
      previous.pages.forEach((page, n) => Object.assign(target.pages[n],page));
      target.marked = false;
      target.restoredOriginal = !!previous.restoredOriginal;
      target.pageIndex = previous.pageIndex;
    });
    await selectFile(state.currentIndex,pageIndex);
    return;
  }
  (forward ? file.history : file.future).push(snapshot(file));
  const previous = from.pop();
  previous.pages.forEach((page, index) => Object.assign(file.pages[index], page));
  file.marked = false;
  file.restoredOriginal = !!previous.restoredOriginal;
  await selectFile(state.currentIndex, previous.pageIndex);
}

async function handleFiles(rawFiles) {
  if (restoring || busy) return;
  const wasEmpty = state.files.length === 0;
  const failures = [];
  setBusy(true);
  try {
  for (const f of Array.from(rawFiles)) {
    if (f.type !== 'application/pdf') continue;
    try {
      const file = attachPageAccessors({ name: f.name, arrayBuffer: await f.arrayBuffer(),
        pages: [], pageIndex: 0, history: [], future: [], marked: false, restoredOriginal: false });
      await initializePages(file);
      state.files.push(file);
    } catch (error) { failures.push(f.name + '：' + error.message); }
  }
  } finally { setBusy(false); fileInput.value = ''; }
  renderFileList();
  if (wasEmpty && state.files.length > 0) await selectFile(0);
  else updateButtons();
  if (failures.length) progressMessage.textContent = '部分檔案未載入：' + failures.join('；');
}

function isExportable(file) {
  return !!file && (file.marked || file.restoredOriginal || file.pages.some(page => page.bakedRects.length || exportableNotes(page.stickyNotes).length));
}

function getPdf(file) {
  if (!file.pdfPromise) {
    const task = pdfjsLib.getDocument({ data: file.arrayBuffer.slice(0), isEvalSupported: false });
    task.onPassword = () => task.destroy();
    file.pdfPromise = task.promise;
  }
  return file.pdfPromise;
}
async function aiPost(path, body) {
  const response = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const data = await response.json().catch(() => null);
  if (!response.ok) throw Error(data?.error || `${path} HTTP ${response.status}`);
  if (!data || typeof data !== 'object') throw Error(`${path} 回傳格式錯誤`);
  return data;
}
async function aiPageCandidates(pdf, index) {
  const page = await pdf.getPage(index + 1);
  try {
    const base = page.getViewport({scale:1});
    const viewport = page.getViewport({scale:1800/base.width});
    if (viewport.width*viewport.height>12000000) throw Error(`第 ${index+1} 頁 OCR 影像超過 1,200 萬像素上限，未降低解析度。`);
    const image = document.createElement('canvas');
    image.width = Math.ceil(viewport.width); image.height = Math.ceil(viewport.height);
    const context = image.getContext('2d');
    if (!context) throw Error('無法建立 OCR 畫布');
    await page.render({canvasContext:context,viewport}).promise;
    const png = image.toDataURL('image/png').split(',')[1];
    image.width = image.height = 0;
    const ocr = await aiPost('/api/ai/ocr',{image:png});
    if (!Array.isArray(ocr.blocks)) throw Error('OCR 回傳缺少 blocks');
    const native = [];
    const content = await page.getTextContent();
    for (const item of content.items) {
      if (!item.str?.trim()) continue;
      const t = pdfjsLib.Util.transform(viewport.transform,item.transform);
      native.push({text:item.str,...nativeItemRect(t,item.width*viewport.scale),confidence:1});
    }
    const blocks = sourceCandidates([...native,...ocr.blocks],index);
    return {blocks,protectedBlocks:[...native,...ocr.blocks],width:imageWidth(viewport),height:imageHeight(viewport),warnings:ocr.warnings||[]};
  } finally {page.cleanup();}
}
function imageWidth(viewport) {return Math.ceil(viewport.width);}
function imageHeight(viewport) {return Math.ceil(viewport.height);}

async function initializePages(file) {
  const pdf = await getPdf(file);
  for (let index = 0; index < pdf.numPages; index++) {
    const source = await pdf.getPage(index + 1);
    const viewport = source.getViewport({ scale: 1 });
    const edit = file.pages[index] || { status: 'pending', rotation: 0, bakedRects: [], pendingRects: [], stickyNotes: [] };
    file.pages[index] = { ...edit, originalImageData: null, origW: 900,
      origH: Math.floor(viewport.height * 900 / viewport.width),
      pdfW: viewport.width, pdfH: viewport.height };
  }
}
const MAX_EDITOR_PIXELS = 24000000;
let editorRenderToken = 0, editorRenderTimer = null;
function editorLogicalSize(file) {
  return file.rotation % 180 ? { width: file.origH, height: file.origW } : { width: file.origW, height: file.origH };
}
async function renderPdfPage(file, index = file.pageIndex, token = ++editorRenderToken) {
  const edit = file.pages[index];
  const requiredWidth = Math.ceil(edit.origW * zoom * (window.devicePixelRatio || 1));
  const requiredHeight = Math.ceil(edit.origH * requiredWidth / edit.origW);
  if (requiredWidth * requiredHeight > MAX_EDITOR_PIXELS) {
    throw new Error('目前縮放與螢幕解析度超過 2,400 萬像素畫布上限；請縮小倍率或改用記憶體較大的裝置。未降低畫質。');
  }
  if (edit.originalImageData && edit.originalImageData.width >= requiredWidth && edit.originalImageData.height >= requiredHeight) return;
  const pdf = await getPdf(file);
  const page = await pdf.getPage(index + 1);
  const viewport = page.getViewport({ scale: requiredWidth / page.getViewport({ scale: 1 }).width });
  const tmp = document.createElement('canvas');
  tmp.width = Math.ceil(viewport.width); tmp.height = Math.ceil(viewport.height);
  const context = tmp.getContext('2d');
  if (!context) throw new Error('無法建立高解析度畫布。');
  try {
    await page.render({ canvasContext: context, viewport }).promise;
    if (token !== editorRenderToken || file !== state.files[state.currentIndex] || index !== file.pageIndex) return;
    edit.originalImageData = context.getImageData(0, 0, tmp.width, tmp.height);
    // Logical edit coordinates never change when the display bitmap is rerendered.
    state.files.forEach(other => other.pages.forEach((cached, n) => {
      if (cached !== edit && !(other === file && n === index)) cached.originalImageData = null;
    }));
  } finally { page.cleanup(); tmp.width = tmp.height = 0; }
}
function scheduleEditorRender() {
  clearTimeout(editorRenderTimer);
  const file = state.files[state.currentIndex];
  if (!file || busy) return;
  const token = ++editorRenderToken;
  editorRenderTimer = setTimeout(async () => {
    try {
      await renderPdfPage(file, file.pageIndex, token);
      if (token === editorRenderToken) redrawCanvas();
    } catch (error) { if (token === editorRenderToken) progressMessage.textContent = '圖面重新繪製失敗：' + error.message; }
  }, 120);
}

// ---- rotation math (0/90/180/270, clockwise) ----
function rotateStepCW(x, y, w, h) { return { x: h - y, y: x }; }
function forwardRotate(x, y, w, h, deg) {
  let steps = (deg / 90) % 4, cx = x, cy = y, cw = w, ch = h;
  for (let i = 0; i < steps; i++) {
    const p = rotateStepCW(cx, cy, cw, ch);
    const nw = ch, nh = cw;
    cx = p.x; cy = p.y; cw = nw; ch = nh;
  }
  return { x: cx, y: cy };
}
function inverseRotate(x, y, w, h, deg) { return forwardRotate(x, y, w, h, (360 - deg) % 360); }

function buildBaselineCanvas(file) {
  const w0 = file.origW, h0 = file.origH;
  const pixels = file.originalImageData;
  const base = document.createElement('canvas');
  base.width = pixels.width; base.height = pixels.height;
  const bctx = base.getContext('2d');
  bctx.putImageData(pixels, 0, 0);
  bctx.save();
  bctx.scale(base.width / w0, base.height / h0);
  bctx.fillStyle = '#fff';
  file.bakedRects.forEach(r => bctx.fillRect(r.x, r.y, r.w, r.h));
  bctx.restore();

  const steps = (file.rotation / 90) % 4;
  if (!steps) return base;
  const outW = steps % 2 ? base.height : base.width;
  const outH = steps % 2 ? base.width : base.height;
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  const octx = out.getContext('2d');
  octx.save();
  octx.translate(outW / 2, outH / 2);
  octx.rotate(file.rotation * Math.PI / 180);
  octx.drawImage(base, -base.width / 2, -base.height / 2);
  octx.restore();
  return out;
}

function wrapStickyText(context, text, maxWidth) {
  const lines = [];
  const paragraphs = String(text || '').replace(/\r/g, '').split('\n');
  paragraphs.forEach(paragraph => {
    if (!paragraph) { lines.push(''); return; }
    let line = '';
    const tokens = paragraph.match(/\s+|[^\s]+/gu) || [];
    tokens.forEach(token => {
      const candidate = line + token;
      if (context.measureText(candidate).width <= maxWidth) {
        line = candidate;
        return;
      }

      if (/^\s+$/u.test(token)) {
        if (line) lines.push(line.trimEnd());
        line = '';
        return;
      }

      if (line) {
        lines.push(line.trimEnd());
        line = '';
      }
      if (context.measureText(token).width <= maxWidth) {
        line = token;
        return;
      }

      const characters = stickyGraphemeSegmenter
        ? Array.from(stickyGraphemeSegmenter.segment(token), part => part.segment)
        : Array.from(token);
      for (const char of characters) {
        const characterCandidate = line + char;
        if (line && context.measureText(characterCandidate).width > maxWidth) {
          lines.push(line);
          line = char;
        } else {
          line = characterCandidate;
        }
      }
    });
    lines.push(line.trimEnd());
  });
  return lines.length ? lines : [''];
}

// Derive PDF line breaks from browser layout, not canvas font metrics: the
// textarea can use a different fallback font and subpixel widths.
function stickyVisualLayout(note, textarea) {
  const style = getComputedStyle(textarea || document.body);
  const mirror = document.createElement('div');
  const width = Math.max(1, note.w - note.padding * 2);
  Object.assign(mirror.style, {
    position: 'absolute', visibility: 'hidden', pointerEvents: 'none',
    left: '-100000px', top: '0', width: `${width}px`,
    fontFamily: style.fontFamily, fontSize: `${note.fontSize}px`,
    fontWeight: style.fontWeight, fontStyle: style.fontStyle,
    letterSpacing: style.letterSpacing, lineHeight: style.lineHeight,
    whiteSpace: 'pre-wrap', overflowWrap: 'anywhere', wordBreak: style.wordBreak
  });
  const lines = [], widths = [], offsets = [];
  const source = String(note.text || '').replace(/\r/g, '');
  let paragraphOffset=0;
  // Keep each paragraph as ONE text node. Separate spans create a break
  // opportunity at every character, unlike the textarea's word wrapping.
  document.body.appendChild(mirror);
  try {
    for (const paragraph of source.split('\n')) {
      if (lines.length) mirror.appendChild(document.createElement('br'));
      const node = document.createTextNode(paragraph);
      mirror.appendChild(node);
      const range = document.createRange();
      let line = '', previousTop = null, offset = 0, lineStart = 0;
      const addLine = end => {
        lines.push(line);
        offsets.push(paragraphOffset+lineStart);
        if (end > lineStart) {
          range.setStart(node, lineStart);
          range.setEnd(node, end);
          widths.push(Math.min(width, range.getClientRects()[0]?.width || 0));
        } else widths.push(0);
        line = '';
        lineStart = end;
      };
      const graphemes = stickyGraphemeSegmenter
        ? Array.from(stickyGraphemeSegmenter.segment(paragraph), part => part.segment)
        : Array.from(paragraph);
      for (const character of graphemes) {
        range.setStart(node, offset);
        offset += character.length;
        range.setEnd(node, offset);
        const rect = range.getClientRects()[0];
        const top = rect?.top ?? previousTop;
        if (previousTop !== null && top > previousTop + 0.5) addLine(offset - character.length);
        line += character;
        previousTop = top;
      }
      addLine(offset);
      paragraphOffset+=paragraph.length+1;
      }
      return {lines, widths, offsets};
  } finally { mirror.remove(); }
}

function fitStickyNoteToText(note) {
  // The rectangle is user-sized; text never changes its height.
  if (!Number.isFinite(note.manualH)) note.manualH = note.h;
  note.h = note.manualH;
}

function keepStickyNoteInBounds(note) {
  const file = state.files[state.currentIndex];
  const {width,height} = editorLogicalSize(file);
  note.x = Math.max(0, Math.min(note.x, Math.max(0, width - note.w)));
  note.y = Math.max(0, Math.min(note.y, Math.max(0, height - note.h)));
}

function drawStickyNote(context, note) {
  context.save();
  if(!note.aiStatus){
    context.fillStyle = note.color || '#ffeb3b';
    context.fillRect(note.x, note.y, note.w, note.h);
    context.strokeStyle = '#111';
    context.lineWidth = 1;
    const inset = context.lineWidth / 2;
    context.strokeRect(note.x + inset, note.y + inset, Math.max(0, note.w - context.lineWidth), Math.max(0, note.h - context.lineWidth));
  }
  context.beginPath();context.rect(note.x,note.y,note.w,note.h);context.clip();
  context.fillStyle = note.textColor || '#111';
  context.font = `${note.fontSize}px 'Noto Sans TC', sans-serif`;
  context.textBaseline = 'top';
  const lineHeight = note.fontSize * 1.35;
  const lines = wrapStickyText(context, note.text, Math.max(1, note.w - note.padding * 2));
  let lineOffset=0;
  lines.forEach((line, index) => {
    const found=note.text.indexOf(line,lineOffset);
    const start=Math.max(lineOffset,found);
    if(note.aiStatus){
      let x=note.x+note.padding;
      for(let i=0;i<line.length;){
        const current=start+i;
        const c=colorAt(note,current);
        let end=i+1;
        while(end<line.length&&colorAt(note,start+end)===c)end++;
        const piece=line.slice(i,end);
        context.fillStyle=c;context.fillText(piece,x,note.y+note.padding+index*lineHeight);
        x+=context.measureText(piece).width;i=end;
      }
    }else context.fillText(line, note.x + note.padding, note.y + note.padding + index * lineHeight);
    lineOffset=start+line.length;
  });
  context.restore();
}

function buildFinalCanvas(file) {
  const finalCanvas = buildBaselineCanvas(file);
  const finalCtx = finalCanvas.getContext('2d');
  file.stickyNotes.filter(note=>!note.aiStatus||note.aiStatus==='confirmed').forEach(note => drawStickyNote(finalCtx, note));
  return finalCanvas;
}

function applyZoom(rebuildNotes = true) {
  const file = state.files[state.currentIndex];
  if (!file) return;
  const {width,height} = editorLogicalSize(file);
  canvas.style.width = (width * zoom) + 'px';
  canvas.style.height = (height * zoom) + 'px';
  if (rebuildNotes) renderStickyNotes();
  else scaleStickyLayer(width, height);
  renderMaskHandles();
}

function scaleStickyLayer(width, height) {
  stickyLayer.style.width = width + 'px';
  stickyLayer.style.height = height + 'px';
  stickyLayer.style.transformOrigin = 'top left';
  stickyLayer.style.transform = `scale(${zoom})`;
}

function positionStickyElement(element, note) {
  element.style.backgroundColor = note.color || '#ffeb3b';
  element.style.left = note.x + 'px';
  element.style.top = note.y + 'px';
  element.style.width = note.w + 'px';
  element.style.height = note.h + 'px';
  element.style.borderWidth = '1px';
  const text = element.querySelector('.sticky-text');
  const colored = element.querySelector('.ai-colored-text');
  if (!text) return;
  text.style.left = note.padding + 'px';
  text.style.top = note.padding + 'px';
  const availableWidth = note.w - note.padding * 2;
  const availableHeight = note.h - note.padding * 2;
  text.style.width = Math.max(0, availableWidth) + 'px';
  text.style.height = Math.max(0, availableHeight) + 'px';
  text.style.visibility = availableWidth > 0 && availableHeight > 0 ? 'visible' : 'hidden';
  text.style.fontSize = note.fontSize + 'px';
  if(colored){
    colored.style.left=text.style.left;colored.style.top=text.style.top;
    colored.style.width=text.style.width;colored.style.height=text.style.height;
    colored.style.fontSize=text.style.fontSize;
  }
}

function beginStickyInteraction(event, note, element, type, corner = '') {
  if (event.button !== undefined && event.button !== 0) return;
  event.preventDefault();
  event.stopPropagation();
  if (type === 'move') document.body.classList.add('grabbing');
  stickyInteraction = {
    file: state.files[state.currentIndex], before: snapshot(state.files[state.currentIndex]),
    pointerId: event.pointerId, note, element, type, corner, zoom,
    startClientX: event.clientX, startClientY: event.clientY,
    x: note.x, y: note.y, w: note.w, h: note.h,
    fontSize: note.fontSize, padding: note.padding, borderWidth: note.borderWidth
  };
  if (event.currentTarget.setPointerCapture) event.currentTarget.setPointerCapture(event.pointerId);
}

function moveStickyInteraction(event) {
  const action = stickyInteraction;
  if (!action || event.pointerId !== action.pointerId) return;
  event.preventDefault();
  const dx = (event.clientX - action.startClientX) / action.zoom;
  const dy = (event.clientY - action.startClientY) / action.zoom;
  const note = action.note;

  if (action.type === 'move') {
    note.x = action.x + dx;
    note.y = action.y + dy;
    keepStickyNoteInBounds(note);
  } else {
    const east = action.corner.includes('e');
    const south = action.corner.includes('s');
    const fixedX = east ? action.x : action.x + action.w;
    const fixedY = south ? action.y : action.y + action.h;
    const {width,height} = editorLogicalSize(action.file);
    const maxWidth = east ? width - fixedX : fixedX;
    const maxHeight = south ? height - fixedY : fixedY;
    note.w = Math.min(maxWidth, Math.max(4, action.w + (east ? dx : -dx)));
    note.manualH = Math.min(maxHeight, Math.max(4, action.h + (south ? dy : -dy)));
    fitStickyNoteToText(note);
    note.x = east ? action.x : action.x + action.w - note.w;
    note.y = south ? action.y : action.y + action.h - note.h;
    keepStickyNoteInBounds(note);
  }
  positionStickyElement(action.element, note);
  if (note.aiStatus) {
    const size=editorLogicalSize(action.file);
    note.aiNeedsReview=noteNeedsReview(note,size.width,size.height,action.file.stickyNotes);
    action.element.classList.toggle('ai-review',note.aiNeedsReview);
  }
}

function endStickyInteraction(event) {
  if (!stickyInteraction || (event.pointerId !== undefined && event.pointerId !== stickyInteraction.pointerId)) return;
  const { file, before } = stickyInteraction;
  if (JSON.stringify(before) !== JSON.stringify(snapshot(file))) {
    remember(file, before);
    if (stickyInteraction.note.aiStatus) {file.marked=false;renderFileList();}
  }
  stickyInteraction = null;
  document.body.classList.remove('grabbing');
}

window.addEventListener('pointermove', moveStickyInteraction, { passive: false });
window.addEventListener('pointerup', endStickyInteraction);
window.addEventListener('pointercancel', endStickyInteraction);

function selectStickyNote(note) {
  selectedNoteId = note?.id ?? null;
  stickyLayer.querySelectorAll('.sticky-note').forEach(element => {
    element.classList.toggle('selected', element.dataset.noteId === selectedNoteId);
  });
  aiTranslationsList.querySelectorAll('.ai-translation-row').forEach(row => {
    row.classList.toggle('selected',row.dataset.noteId === selectedNoteId && Number(row.dataset.pageIndex) === state.files[state.currentIndex]?.pageIndex);
  });
  updateButtons();
}
function adjustSelectedNoteFont(delta) {
  const file = state.files[state.currentIndex];
  const note = file?.stickyNotes.find(item => item.id === selectedNoteId);
  if (!note || busy) return;
  const next = Math.max(1, Math.min(72, Math.round(note.fontSize * zoom + delta))) / zoom;
  if (next === note.fontSize) return;
  remember(file);
  note.fontSize = next;
  if(note.aiStatus) {
    const size=editorLogicalSize(file);
    note.aiNeedsReview=noteNeedsReview(note,size.width,size.height,file.stickyNotes);
    file.marked=false;
  }
  fitStickyNoteToText(note);
  keepStickyNoteInBounds(note);
  renderStickyNotes();
  updateButtons();
}
fontGrowBtn.onclick = () => adjustSelectedNoteFont(1);
fontShrinkBtn.onclick = () => adjustSelectedNoteFont(-1);

function changePageTranslations(remove) {
  const file = state.files[state.currentIndex];
  if (!file || busy || restoring || !file.originalImageData) return;
  const targets = file.stickyNotes.filter(note => note.aiStatus && (remove || note.aiStatus !== 'confirmed'));
  if (!targets.length) return;
  remember(file);
  if (remove) {
    file.stickyNotes = file.stickyNotes.filter(note => !note.aiStatus);
    if (targets.some(note => note.id === selectedNoteId)) selectedNoteId = null;
  } else targets.forEach(note => { note.aiStatus = 'confirmed'; });
  file.marked = false;
  if (remove) renderStickyNotes();
  renderFileList();updateButtons();
}
aiRetainPageBtn.onclick = () => changePageTranslations(false);
aiDeletePageBtn.onclick = () => changePageTranslations(true);

function renderTranslationList() {
  const file = state.files[state.currentIndex];
  const notes = file?.pages.flatMap((page,pageIndex) => page.stickyNotes
    .filter(note => note.aiStatus).map(note => ({note,pageIndex}))) || [];
  aiTranslations.hidden = !notes.length;
  aiTranslations.querySelector('summary').textContent = `本檔 AI 翻譯 ${notes.length} 筆（按此展開／收合）`;
  aiTranslationsList.replaceChildren();
  notes.forEach(({note,pageIndex}) => {
    const row=document.createElement('div');
    row.className='ai-translation-row';
    row.dataset.noteId=note.id;
    row.dataset.pageIndex=pageIndex;
    row.tabIndex=0;
    row.setAttribute('role','button');
    row.setAttribute('aria-label',`第 ${pageIndex+1} 頁，原文 ${note.sourceText || note.aiSourceText || ''}，譯文 ${note.text || ''}，選取翻譯便利貼`);
    row.classList.toggle('selected',pageIndex===file.pageIndex && selectedNoteId===note.id);
    const label=(className,value) => {
      const span=document.createElement('span');span.className=className;
      span.textContent=value;span.title=value;
      return span;
    };
    const actions=document.createElement('span');actions.className='ai-translation-actions';
    const remove=document.createElement('button');remove.type='button';remove.className='ai-delete';remove.textContent='刪除';
    remove.setAttribute('aria-label',`刪除第 ${pageIndex+1} 頁翻譯`);
    remove.disabled=busy || restoring;
    remove.onclick=event=>{event.stopPropagation();changeTranslationNote(pageIndex,note.id,true);};
    actions.append(remove);
    row.append(label('ai-page',`第 ${pageIndex+1} 頁`),label('ai-source',note.sourceText || note.aiSourceText || ''),label('ai-translation',note.text || ''),actions);
    row.onclick=async()=>{
      if (busy || restoring) return;
      if (file.pageIndex!==pageIndex) await selectFile(state.currentIndex,pageIndex);
      const current=file.pages[pageIndex].stickyNotes.find(item=>item.id===note.id);
      if (!current || file.pageIndex!==pageIndex) return;
      selectStickyNote(current);
      stickyLayer.querySelectorAll('.sticky-note').forEach(element=>{
        if (element.dataset.noteId===note.id) element.scrollIntoView?.({block:'nearest',inline:'nearest'});
      });
    };
    row.onkeydown=event=>{
      if (event.target!==row || !['Enter',' '].includes(event.key)) return;
      event.preventDefault();row.click();
    };
    aiTranslationsList.append(row);
  });
}

function changeTranslationNote(pageIndex,noteId,remove) {
  const file=state.files[state.currentIndex];
  if (!file || busy || restoring || !file.pages[pageIndex]) return;
  const page=file.pages[pageIndex];
  const note=page.stickyNotes.find(item=>item.id===noteId && item.aiStatus);
  if (!note || (!remove && note.aiStatus==='confirmed')) return;
  remember(file);
  if (remove) {
    page.stickyNotes=page.stickyNotes.filter(item=>item!==note);
    if (pageIndex===file.pageIndex && selectedNoteId===noteId) selectedNoteId=null;
  } else note.aiStatus='confirmed';
  file.marked=false;
  if (pageIndex===file.pageIndex && remove) renderStickyNotes();
  renderFileList();updateButtons();
}

function renderStickyNotes() {
  stickyLayer.innerHTML = '';
  const file = state.files[state.currentIndex];
  if (!file) { translationSelection=null;renderTranslationList(); return; }
  if(translationSelection && (translationSelection.pageIndex!==file.pageIndex || !file.stickyNotes.some(note=>note.id===translationSelection.noteId)))translationSelection=null;
  if (!file.stickyNotes.some(note => note.id === selectedNoteId)) selectedNoteId = null;
  const {width,height} = editorLogicalSize(file);
  scaleStickyLayer(width, height);

  file.stickyNotes.forEach(note => {
    if(note.aiStatus && note.color==='#000000' && note.textColor==='#ffffff'){
      note.color='transparent';note.textColor=TRANSLATION_RED;
    }
    fitStickyNoteToText(note);
    keepStickyNoteInBounds(note);
    const element = document.createElement('div');
    element.className = 'sticky-note' + (note.aiStatus ? ' ai-note' : '');
    element.classList.toggle('ai-review',!!note.aiNeedsReview);
    element.dataset.noteId = note.id;
    if (note.aiStatus) element.title = [`原文：${note.sourceText || note.aiSourceText || ''}`, note.aiWarning || '譯文須人工校對'].join('\n');
    element.classList.toggle('selected', note.id === selectedNoteId);
    element.addEventListener('pointerdown', event => {
      selectStickyNote(note);
      if (event.target === element) beginStickyInteraction(event, note, element, 'move');
    });

    const text = document.createElement('textarea');
    text.className = 'sticky-text';
    text.value = note.text;
    text.placeholder = '輸入文字';
    text.setAttribute('aria-label', note.aiStatus ? 'AI 翻譯草稿文字' : '便利貼文字');
    text.style.color = note.aiStatus ? 'transparent' : note.textColor || '#111';
    const colored=note.aiStatus?document.createElement('div'):null;
    const paintColors=()=>{
      if(!colored)return;
      colored.replaceChildren(...colorSegments(note).map(part=>{
        const span=document.createElement('span');span.textContent=part.text;span.style.color=part.color;return span;
      }));
    };
    if(colored){colored.className='ai-colored-text';colored.setAttribute('aria-hidden','true');paintColors();}
    const trackSelection=()=>{
      if(!note.aiStatus)return;
      translationSelection=text.selectionStart<text.selectionEnd ? {
        noteId:note.id,pageIndex:file.pageIndex,start:text.selectionStart,end:text.selectionEnd
      }:null;
      updateButtons();
    };
    text.addEventListener('select',trackSelection);
    text.addEventListener('keyup',trackSelection);
    text.addEventListener('pointerup',trackSelection);
    text.addEventListener('blur',()=>{if(!translationColorBtn.contains(document.activeElement)&&!translationColorMenu.contains(document.activeElement)){translationSelection=null;updateButtons();}});
    text.addEventListener('beforeinput',event=>{text.dataset.editStart=String(text.selectionStart);text.dataset.editEnd=String(text.selectionEnd);});
    text.addEventListener('input', () => {
      const current=file.stickyNotes.find(item=>item.id===note.id);
      if (!current || current.text === text.value) return;
      remember(file);
      if(current.aiStatus){
        const old=current.text, next=text.value;
        let start=0;while(start<old.length&&start<next.length&&old[start]===next[start])start++;
        let suffix=0;while(suffix<old.length-start&&suffix<next.length-start&&old[old.length-1-suffix]===next[next.length-1-suffix])suffix++;
        adjustColorRuns(current,start,old.length-start-suffix,next.length-start-suffix);
      }
      current.text = text.value;
      paintColors();
      translationSelection=null;
      if(current.aiStatus) {
        current.aiNeedsReview=noteNeedsReview(current,width,height,file.stickyNotes);
        element.classList.toggle('ai-review',current.aiNeedsReview);
        file.marked=false;renderFileList();updateButtons();
      }
      fitStickyNoteToText(current);
      keepStickyNoteInBounds(current);
      positionStickyElement(element, current);
    });
    text.addEventListener('pointerdown', event => { event.stopPropagation(); selectStickyNote(note); });
    text.addEventListener('focus', () => selectStickyNote(note));

    const dragHandle = document.createElement('div');
    dragHandle.className = 'sticky-drag-handle';
    dragHandle.title = '拖曳便利貼';
    dragHandle.addEventListener('pointerdown', event => beginStickyInteraction(event, note, element, 'move'));

    const deleteButton = document.createElement('button');
    deleteButton.type = 'button';
    deleteButton.className = 'sticky-delete';
    deleteButton.textContent = '×';
    deleteButton.title = '刪除便利貼';
    deleteButton.setAttribute('aria-label', '刪除便利貼');
    deleteButton.addEventListener('click', event => {
      event.stopPropagation();
      remember(file);
      file.stickyNotes = file.stickyNotes.filter(item => item !== note);
      if (selectedNoteId === note.id) selectedNoteId = null;
      renderStickyNotes();
      renderFileList();
      updateButtons();
    });

    if(colored)element.append(colored);
    element.append(text, dragHandle);
    if(note.aiStatus){
      const removeTranslation=document.createElement('button');
      removeTranslation.type='button';removeTranslation.className='ai-note-delete';
      removeTranslation.textContent='×';removeTranslation.title='刪除翻譯貼紙';removeTranslation.setAttribute('aria-label','刪除翻譯貼紙');
      removeTranslation.addEventListener('pointerdown',event=>event.stopPropagation());
      removeTranslation.addEventListener('click',event=>{
        event.stopPropagation();changeTranslationNote(file.pageIndex,note.id,true);
      });
      element.append(removeTranslation);
    }
    if(!note.aiStatus) element.append(deleteButton);
    ['nw', 'ne', 'sw', 'se'].forEach(corner => {
      const handle = document.createElement('div');
      handle.className = `sticky-resize ${corner}`;
      handle.title = '縮放便利貼';
      handle.addEventListener('pointerdown', event => beginStickyInteraction(event, note, element, 'resize', corner));
      element.appendChild(handle);
    });
    stickyLayer.appendChild(element);
    positionStickyElement(element, note);
  });
  renderTranslationList();
}

// The rectangle body moves the selection; its four corners resize it.
function renderMaskHandles() {
  maskLayer.replaceChildren();
  const file = state.files[state.currentIndex];
  if (!file) return;
  ['pendingRects', 'bakedRects'].forEach(kind => {
    file[kind].forEach(rect => {
      const box = document.createElement('div');
      box.className = 'mask-box';
      box.dataset.kind = kind;
      Object.assign(box.style, { left: rect.x * zoom + 'px', top: rect.y * zoom + 'px',
        width: rect.w * zoom + 'px', height: rect.h * zoom + 'px' });
      box.addEventListener('pointerdown', event => {
        if (event.button !== 0 || event.target !== box) return;
        event.preventDefault(); event.stopPropagation();
        document.body.classList.add('grabbing');
        maskInteraction = { file, rect, type: 'move', start: canvasPos(event),
          before: snapshot(file), original: { ...rect }, pointerId: event.pointerId };
      });
      ['nw', 'ne', 'sw', 'se'].forEach(corner => {
        const handle = document.createElement('div');
        handle.className = 'sticky-resize ' + corner;
        handle.title = kind === 'pendingRects' ? '調整待遮蓋區域大小' : '調整已遮蓋區域大小';
        handle.addEventListener('pointerdown', event => {
          if (event.button !== 0) return;
          event.preventDefault(); event.stopPropagation();
          maskInteraction = { file, rect, corner, before: snapshot(file), original: { ...rect }, pointerId: event.pointerId };
        });
        box.appendChild(handle);
      });
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'mask-delete';
      remove.textContent = '×';
      remove.title = kind === 'pendingRects' ? '刪除待遮蓋紅框' : '刪除已遮蓋白框並恢復原圖';
      remove.setAttribute('aria-label', remove.title);
      remove.addEventListener('pointerdown', event => event.stopPropagation());
      remove.addEventListener('click', event => {
        event.stopPropagation();
        const index = file[kind].indexOf(rect);
        if (index < 0) return;
        remember(file);
        file[kind].splice(index,1);
        if (kind === 'bakedRects') {
          file.restoredOriginal = true; // Keep the restored source eligible for re-export.
          if (!file.bakedRects.length) file.status = 'pending';
        }
        file.marked = false;
        redrawCanvas();
        renderFileList();
        updateButtons();
      });
      box.appendChild(remove);
      maskLayer.appendChild(box);
    });
  });
}
window.addEventListener('pointermove', event => {
  const action = maskInteraction;
  if (!action || action.pointerId !== event.pointerId) return;
  event.preventDefault();
  const p = canvasPos(event), r = action.original;
  if (action.type === 'move') {
    const {width,height} = editorLogicalSize(action.file);
    action.rect.x = Math.max(0, Math.min(width - r.w, r.x + p.x - action.start.x));
    action.rect.y = Math.max(0, Math.min(height - r.h, r.y + p.y - action.start.y));
    redrawCanvas();
    return;
  }
  const east = action.corner.includes('e'), south = action.corner.includes('s');
  const fixedX = east ? r.x : r.x + r.w, fixedY = south ? r.y : r.y + r.h;
  const movingX = east ? Math.max(fixedX + 4, p.x) : Math.min(fixedX - 4, p.x);
  const movingY = south ? Math.max(fixedY + 4, p.y) : Math.min(fixedY - 4, p.y);
  Object.assign(action.rect, { x: Math.min(fixedX, movingX), y: Math.min(fixedY, movingY),
    w: Math.abs(movingX - fixedX), h: Math.abs(movingY - fixedY) });
  redrawCanvas();
}, { passive: false });
function endMaskInteraction(event) {
  if (!maskInteraction || maskInteraction.pointerId !== event.pointerId) return;
  const { file, before } = maskInteraction;
  if (JSON.stringify(before) !== JSON.stringify(snapshot(file))) remember(file, before);
  maskInteraction = null;
  document.body.classList.remove('grabbing');
}
window.addEventListener('pointerup', endMaskInteraction);
window.addEventListener('pointercancel', endMaskInteraction);

function redrawCanvas() {
  const file = state.files[state.currentIndex];
  if (!file) return;
  const baseline = buildBaselineCanvas(file);
  canvas.width = baseline.width;
  canvas.height = baseline.height;
  ctx.drawImage(baseline, 0, 0);
  const {width,height} = editorLogicalSize(file);
  ctx.save();
  ctx.scale(canvas.width / width, canvas.height / height);
  ctx.strokeStyle = '#ff4d4d';
  ctx.lineWidth = 2;
  file.pendingRects.forEach(r => ctx.strokeRect(r.x, r.y, r.w, r.h));
  ctx.restore();
  applyZoom();
}

function updateButtons() {
  const file = state.files[state.currentIndex];
  const ready = !!file && !!file.originalImageData && !restoring && !busy;
  undoBtn.disabled = !ready || !file.history.length;
  redoBtn.disabled = !ready || !file.future.length;
  batchBtn.disabled = !ready || file.pendingRects.length === 0;
  markBtn.disabled = !ready;
  markBtn.setAttribute('aria-pressed', String(!!file && !!file.marked));

async function selectFile(index, pageIndex = state.files[index]?.pageIndex || 0) {

  } catch (error) { progressMessage.textContent = '頁面載入失敗：' + error.message; }

}

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  const {width,height} = editorLogicalSize(state.files[state.currentIndex]);
  const scaleX = width / r.width, scaleY = height / r.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: Math.max(0, Math.min(width, (clientX - r.left) * scaleX)), y: Math.max(0, Math.min(height, (clientY - r.top) * scaleY)) };
}

function startDrag(e) {
  const file = state.files[state.currentIndex];
  if (!file || !file.originalImageData) return;
  const p = canvasPos(e);
  dragging = true; startX = p.x; startY = p.y; tempRect = { x: p.x, y: p.y, w: 0, h: 0 };
}
function moveDrag(e) {
  if (!dragging) return;
  const p = canvasPos(e);
  const x = Math.min(startX, p.x), y = Math.min(startY, p.y);
  const w = Math.abs(p.x - startX), h = Math.abs(p.y - startY);
  tempRect = { x, y, w, h };
  redrawCanvas();
  ctx.save();
  const size = editorLogicalSize(state.files[state.currentIndex]);
  ctx.scale(canvas.width / size.width, canvas.height / size.height);
  ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  ctx.restore();
}
function endDrag() {
  if (!dragging) return;
  dragging = false;
  const file = state.files[state.currentIndex];
  if (file && tempRect && tempRect.w > 3 && tempRect.h > 3) {
    remember(file);
    file.pendingRects.push(tempRect);
  }
  tempRect = null;
  redrawCanvas();
  updateButtons();
}

window.addEventListener('mouseup', endDrag);

function copySelectedStickyNotes(scope) {
  const sourceIndex=state.currentIndex;
  const sourceFile=state.files[sourceIndex];
  const note=sourceFile?.stickyNotes.find(item=>item.id===selectedNoteId && !item.aiStatus);
  if(!note || !sourceFile.originalImageData || busy || restoring)return;
  const plan=planStickyNoteCopies(state.files,sourceIndex,sourceFile.pageIndex,note.id,scope);
  if(!plan.length)return;
  const remembered=new Set();
  const saveBefore=index=>{
    if(remembered.has(index))return;
    remember(state.files[index]);remembered.add(index);
  };
  // The source joins cross-file history so undo/redo from this workspace
  // reverses the entire batch, including every other document's first page.
  saveBefore(sourceIndex);
  for(const {fileIndex,pageIndex,rect,scale} of plan){
    saveBefore(fileIndex);
    const target=state.files[fileIndex];
    const copy=JSON.parse(JSON.stringify(note));
    Object.assign(copy,rect,{id:`note-${++noteSequence}`,manualH:rect.h,
      fontSize:note.fontSize*scale,padding:note.padding*scale});
    target.pages[pageIndex].stickyNotes.push(copy);
    target.marked=false;
  }
  sourceFile.marked=false;
  if(scope==='other-first-pages'){
    const group={id:crypto.randomUUID(),members:[...remembered]};
    group.members.forEach(index=>{state.files[index].history.at(-1).crossBatchGroup=group;});
  }
  refreshEditor();
  progressMessage.textContent=`已複製便利貼至 ${plan.length} 個${scope==='file'?'檔內頁面':'餘檔首頁'}；尺寸不同的頁面放在左上角。可用「復原」撤銷整批。`;
}

applyBtn.onclick = () => {
  const file = state.files[state.currentIndex];
  if (!file || file.pendingRects.length === 0) return;
  remember(file);
  const {width:outW,height:outH} = editorLogicalSize(file);
  file.pendingRects.forEach(r => {
    const p1 = inverseRotate(r.x, r.y, outW, outH, file.rotation);
    const p2 = inverseRotate(r.x + r.w, r.y + r.h, outW, outH, file.rotation);
    file.bakedRects.push({
      x: Math.min(p1.x, p2.x), y: Math.min(p1.y, p2.y),
      w: Math.abs(p2.x - p1.x), h: Math.abs(p2.y - p1.y)
    });
  });
  file.pendingRects = [];
  file.status = 'done';
  renderFileList();
  redrawCanvas();
  updateButtons();
};

batchBtn.onclick = () => {
  const file = state.files[state.currentIndex];
  if (!file || busy) return;
  const source = file.pages[file.pageIndex];
  if (!source.pendingRects.length) return;
  const areas = source.pendingRects.map(r => ({
    x: r.x / source.origW, y: r.y / source.origH, w: r.w / source.origW, h: r.h / source.origH
  }));
  if (!areas.length) return;
  const before = snapshot(file);
  file.pages.forEach(page => {
    areas.forEach(area => {
      const rect = { x: area.x * page.origW, y: area.y * page.origH,
        w: area.w * page.origW, h: area.h * page.origH };
      const same = item => ['x', 'y', 'w', 'h'].every(key => Math.abs(item[key] - rect[key]) < 0.01);
      if (!page.bakedRects.some(same)) page.bakedRects.push(rect);
      page.pendingRects = page.pendingRects.filter(item => !same(item));
    });
    page.status = 'done';
  });
  if (JSON.stringify(before) !== JSON.stringify(snapshot(file))) remember(file, before);
  refreshEditor();
  progressMessage.textContent = `已將 ${areas.length} 個區域按比例遮蓋至「${file.name}」全部 ${file.pages.length} 頁；可按「復原」撤銷整批。`;
};

batchOtherBtn.onclick = () => {
  const sourceIndex = state.currentIndex;
  const file = state.files[sourceIndex];
  if (!file || busy || state.files.length < 2 || !file.pendingRects.length) return;
  const plan = planCrossFileMasks(state.files,sourceIndex,file.pageIndex);
  if (!plan.length) return;
  const pendingCount = file.pendingRects.length;
  const remembered = new Set();
  const saveBefore = (index) => {
    if (remembered.has(index)) return;
    remember(state.files[index]);
    remembered.add(index);
  };
  saveBefore(sourceIndex);
  file.pendingRects = [];
  file.marked = false;
  let masked = 0, framed = 0;
  for (const {fileIndex,pageIndex,kind,rects,pendingToRemove = []} of plan) {
    const target = state.files[fileIndex], page = target.pages[pageIndex];
    saveBefore(fileIndex);
    page[kind].push(...rects);
    if (pendingToRemove.length) page.pendingRects = page.pendingRects.filter(old => !pendingToRemove.includes(old));
    if (kind === 'bakedRects') { page.status = 'done'; masked += rects.length; }
    else framed += rects.length;
    target.marked = false;
  }
  const group = { id: crypto.randomUUID(), members: [...remembered] };
  group.members.forEach(index => { state.files[index].history.at(-1).crossBatchGroup = group; });
  refreshEditor();
  progressMessage.textContent = `已套用 ${pendingCount} 個紅框：相同尺寸頁面直接白色遮蔽（${masked} 區），不同尺寸首頁僅加入待確認紅框（${framed} 區）。`;
};

resetBtn.onclick = () => {

// Preview and export consume exactly the same PDF builder.
async function buildFinalPdf(file) {
  const edits = file.pages.map(page => ({ ...page, stickyNotes: exportableNotes(page.stickyNotes).map(note => {
    const textarea = stickyLayer.querySelector(`[data-note-id="${note.id}"] .sticky-text`);
    const {lines, widths, offsets} = stickyVisualLayout(note, textarea);
    // Retained notes keep their fixed-size appearance and complete annotation text.
    return { ...note, color:note.aiStatus?'transparent':note.color,
      textColor:note.aiStatus && note.textColor==='#ffffff'?TRANSLATION_RED:note.textColor,
      visualLines: lines, visualWidths: widths, visualOffsets: offsets };
  }) }));
  return exportIndependentPDF(file.arrayBuffer.slice(0),edits);
}

// Continuous, lazily rendered whole-PDF preview.
const modal = document.getElementById('previewModal');
const modalBody = document.getElementById('modalBody');
const modalTitle = document.getElementById('modalTitle');
const mZoomLabel = document.getElementById('mZoomLabel');
let previewPdf = null, previewObserver = null, previewToken = 0, modalScale = 1, refreshPreview = null;
const MAX_PREVIEW_PIXELS = 80000000;
function previewPixelWidth(sheet) {
  return Math.ceil(sheet.getBoundingClientRect().width * (window.devicePixelRatio || 1));
}
function setModalScale(scale) {
  modalScale = Math.min(3, Math.max(0.25, scale));
  modalBody.querySelectorAll('.preview-sheet').forEach(sheet => {
    const width = Math.min(900, Math.max(100, modalBody.clientWidth - 40)) * modalScale;
    sheet.style.width = width + 'px';
    sheet.querySelector('.preview-paper').style.height = width * Number(sheet.dataset.ratio) + 'px';
  });
  mZoomLabel.textContent = Math.round(modalScale * 100) + '%';
  refreshPreview?.();
}

function closePreviewModal() {
  previewToken++;
  if (previewObserver) previewObserver.disconnect();
  previewObserver = null;
  refreshPreview = null;
  if (previewPdf) previewPdf.destroy();
  previewPdf = null;
  modalBody.replaceChildren();
  modal.classList.remove('open');
}

previewBtn.onclick = async () => {
  const file = state.files[state.currentIndex];
  if (!file || busy) return;
  closePreviewModal();
  const token = previewToken;
  setBusy(true);
  modal.classList.add('open');
  modalTitle.textContent = '正在產生整份 PDF 預覽…';
  try {
    const bytes = await buildFinalPdf(file);
    if (token !== previewToken) return;
    const pdf = await pdfjsLib.getDocument({ data: bytes, isEvalSupported: false }).promise;
    if (token !== previewToken) { await pdf.destroy(); return; }
    previewPdf = pdf;
    modalTitle.textContent = `預覽本檔完工圖 — ${file.name}（共 ${pdf.numPages} 頁）`;
    let renderQueue = Promise.resolve();
    function queueSheet(sheet) {
      if (sheet.dataset.visible !== 'true' || sheet.dataset.queued === 'true') return;
      sheet.dataset.queued = 'true';
      let rendered = false;
      renderQueue = renderQueue.then(async () => {
        if (token !== previewToken || sheet.dataset.visible !== 'true') return;
        const width = previewPixelWidth(sheet);
        const height = Math.ceil(width * Number(sheet.dataset.ratio));
        if (width * height > MAX_PREVIEW_PIXELS) throw new Error('目前倍率超過 8,000 萬像素預覽上限；請縮小倍率。未降低畫質。');
        const old = sheet.querySelector('canvas');
        if (old?.width === width && old.height === height) return;
        const page = await pdf.getPage(Number(sheet.dataset.page));
        if (token !== previewToken) return;
        try {
          const viewport = page.getViewport({ scale: width / page.getViewport({ scale: 1 }).width });
          const image = document.createElement('canvas');
          image.setAttribute('aria-label', `第 ${sheet.dataset.page} 頁完工預覽`);
          image.width = Math.ceil(viewport.width); image.height = Math.ceil(viewport.height);
          await page.render({ canvasContext: image.getContext('2d'), viewport }).promise;
          if (token !== previewToken || sheet.dataset.visible !== 'true') return;
          old?.remove();
          sheet.querySelector('.preview-paper').appendChild(image);
          rendered = true;
        } finally { page.cleanup(); }
      }).catch(error => {
        if (token === previewToken) modalTitle.textContent = '預覽載入失敗：' + error.message;
      }).finally(() => {
        sheet.dataset.queued = 'false';
        if (token === previewToken && sheet.dataset.visible === 'true') {
          const image = sheet.querySelector('canvas');
          if (rendered && image && image.width !== previewPixelWidth(sheet)) queueSheet(sheet);
        }
      });
    }
    refreshPreview = () => modalBody.querySelectorAll('.preview-sheet').forEach(queueSheet);
    previewObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const sheet = entry.target;
        sheet.dataset.visible = String(entry.isIntersecting);
        if (entry.isIntersecting) queueSheet(sheet);
        else {
          const old = sheet.querySelector('canvas');
          if (old) { old.width = old.height = 0; old.remove(); }
        }
      });
    }, { root: modalBody, rootMargin: '300px' });
    file.pages.forEach((page, index) => {
      const sheet = document.createElement('figure');
      sheet.className = 'preview-sheet';
      sheet.dataset.page = index + 1;
      sheet.dataset.ratio = page.pdfH / page.pdfW;
      sheet.innerHTML = `<figcaption>第 ${index + 1} / ${pdf.numPages} 頁</figcaption><div class="preview-paper"></div>`;
      modalBody.appendChild(sheet);
      previewObserver.observe(sheet);
    });
    setModalScale(1);
    modalBody.scrollTop = modalBody.scrollLeft = 0;
    progressMessage.textContent = `已產生「${file.name}」整份 ${pdf.numPages} 頁預覽。`;
  } catch (error) { modalTitle.textContent = '預覽失敗：' + error.message; }
  finally { setBusy(false); }
};

// Resize the sidebar without affecting the PDF or its edit coordinates.
const sidebar = document.querySelector('aside');

}

const editorScroll = document.querySelector('.canvas-scroll');
function zoomAt(next, clientX, clientY) {
  const bounds = canvas.getBoundingClientRect();
  const x = (clientX - bounds.left) / zoom, y = (clientY - bounds.top) / zoom;
  zoom = Math.max(0.3, Math.min(3, next));
  applyZoom(false);
  scheduleEditorRender();
  const after = canvas.getBoundingClientRect();
  editorScroll.scrollLeft += after.left + x * zoom - clientX;

}
// Trackpad pinch is delivered as a Ctrl+wheel event in Chromium/Firefox.
editorScroll.addEventListener('wheel', event => {

}, { passive: false });
let gestureZoom = 1;

editorScroll.addEventListener('gesturechange', event => {
  event.preventDefault();
  zoomAt(gestureZoom * event.scale, event.clientX, event.clientY);
});

exportBtn.onclick = async () => {
  if (busy) return;
  setBusy(true);
  exportBtn.disabled = true;
  progressMessage.textContent = '正在產生完工圖壓縮檔…';
  try {
  const zipObj = new JSZip();
  const done = state.files.filter(isExportable);
  const names = new Set(), sizes = [];
  for (const f of done) {
    progressMessage.textContent = `正在產生「${f.name}」的 PDF…`;
    const pdfBytes = await buildFinalPdf(f);
    const base = f.name.replace(/\.pdf$/i, '');
    let name = `${base}_NL.pdf`, suffix = 2;
    while (names.has(name.toLowerCase())) name = `${base}_${suffix++}_NL.pdf`;
    names.add(name.toLowerCase());
    sizes.push({ name, bytes: pdfBytes.byteLength });
    zipObj.file(name, pdfBytes);
  }
  const oversized = sizes.filter(item => item.bytes > 100 * 1024);
  if (oversized.length) {
    const details = sizes.map(item => `${item.name}：${(item.bytes / 1024).toFixed(1)} KB`).join('\n');
    if (!window.confirm(`PDF 已完成，以下為各檔實際大小（100 KB 為目標，未降低品質）：\n${details}\n\n有 ${oversized.length} 份超過 100 KB。仍要下載 ZIP 嗎？`)) {
      progressMessage.textContent = `已取消下載；${oversized.length} 份 PDF 超過 100 KB，未降低原始品質。`;
      return;
    }
  }
  const content = await zipObj.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url; a.download = 'drawing_NL.zip';
  document.body.appendChild(a);
  a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  progressMessage.textContent = `已準備 ${done.length} 個完工圖 PDF（${sizes.map(item => `${item.name} ${(item.bytes / 1024).toFixed(1)} KB`).join('；')}），並發出 ZIP 下載要求。`;
  } catch (error) {
    progressMessage.textContent = '匯出失敗：' + error.message;
  } finally {
    setBusy(false);
    renderFileList();
  }
};

saveProgressBtn.onclick = async () => {
  if (saving || restoring || busy || !state.files.length) return;
  saving = true;
  clearProgressBtn.disabled = true;
  updateButtons();
  progressMessage.textContent = '正在暫存目前進度…';
  try {
    // Store the source PDFs once; history contains only editable state, never raster data.
    const archive = new JSZip();
    const savedFiles = state.files.map((file, index) => {
      archive.file(`sources/${index}.pdf`, file.arrayBuffer.slice(0));
      return { name: file.name, ...snapshot(file), history: JSON.parse(JSON.stringify(file.history)),
        future: JSON.parse(JSON.stringify(file.future)) };
    });
    archive.file('progress.json', JSON.stringify({ version: 11, notePaddingVersion: 2, currentIndex: state.currentIndex,
      zoom, noteSequence, files: savedFiles }));
    const packed = await archive.generateAsync({ type: 'base64', compression: 'DEFLATE' });
    // setItem is atomic: quota errors leave the previous saved progress intact.
    localStorage.setItem(STORAGE_KEY, packed);
    progressMessage.textContent = '已暫存目前進度（含原始 PDF 與復原紀錄）；重新整理後會自動還原。';
  } catch (error) {
    progressMessage.textContent = error.name === 'QuotaExceededError'
      ? '暫存失敗：瀏覽器儲存空間不足。先前的暫存仍保留，請勿重新整理以免失去本次編輯。'
      : '暫存失敗：瀏覽器可能禁止本機儲存，請勿重新整理。' + error.message;
  } finally {
    saving = false;
    clearProgressBtn.disabled = false;
    updateButtons();
  }
};

clearProgressBtn.onclick = () => {
  if (saving || restoring || busy) return;
  try {
    if (!window.confirm('確定清除圖面編輯區的全部暫存與目前檔案？此操作無法復原，不會影響案件資料。')) return;
    localStorage.removeItem(STORAGE_KEY);
    state.files = [];
    state.currentIndex = -1;
    location.reload();
  } catch (error) {
    progressMessage.textContent = '無法清除暫存：' + error.message;
  }
};

async function restoreProgress() {
  restoring = true;
  fileInput.disabled = true;
  clearProgressBtn.disabled = true;
  try {
    const packed = localStorage.getItem(STORAGE_KEY);
    if (!packed) return;
    progressMessage.textContent = '正在還原暫存進度…';
    const archive = await JSZip.loadAsync(packed, { base64: true });
    const saved = JSON.parse(await archive.file('progress.json').async('string'));
    if (saved.version !== 11 || !Array.isArray(saved.files)) throw new Error('暫存格式不符');
    migrateNotePadding(saved);
    const files = [];
    for (let index = 0; index < saved.files.length; index++) {
      const file = attachPageAccessors({ ...saved.files[index],
        arrayBuffer: await archive.file(`sources/${index}.pdf`).async('arraybuffer') });
      await initializePages(file);
      files.push(file);
    }
    state.files = files;
    zoom = Math.min(3, Math.max(0.3, Number(saved.zoom) || 1));
    noteSequence = Number(saved.noteSequence) || 0;
    if (files.length) await selectFile(Math.max(0, Math.min(files.length - 1, saved.currentIndex || 0)));
    progressMessage.textContent = `已還原 ${files.length} 個檔案的編輯進度與復原紀錄。`;
  } catch (error) {
    state.files = []; state.currentIndex = -1;
    renderFileList();
    progressMessage.textContent = '暫存還原失敗，原暫存未刪除：' + error.message;
  } finally {
    restoring = false;
    fileInput.disabled = false;
    clearProgressBtn.disabled = false;
    updateButtons();
    renderTranslationList();
  }
}
restoreProgress();
</script>
</body>
